name: Build Installers

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - id: version
        run: npm run check:release-version

      - run: npm run check:package
      - run: npm run build

  build-windows:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run package:win

      - uses: actions/upload-artifact@v4
        with:
          name: Whisphry-${{ needs.verify.outputs.package_version }}-windows
          path: |
            dist/*.exe
          retention-days: 1

  build-mac:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run package:mac

      - uses: actions/upload-artifact@v4
        with:
          name: Whisphry-${{ needs.verify.outputs.package_version }}-mac
          path: |
            dist/*.dmg
            dist/*.zip
          retention-days: 1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, build-windows, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Whisphry ${{ github.ref_name }}
          files: |
            artifacts/Whisphry-${{ needs.verify.outputs.package_version }}-windows/*
            artifacts/Whisphry-${{ needs.verify.outputs.package_version }}-mac/*
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
